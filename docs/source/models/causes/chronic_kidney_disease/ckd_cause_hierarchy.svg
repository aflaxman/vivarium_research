<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800">
  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Chronic Kidney Disease Cause Hierarchy (GBD 2023)
  </text>

  <!-- All Causes -->
  <rect x="250" y="60" width="400" height="45" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="450" y="88" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">
    All causes (c_294)
  </text>

  <!-- CMNN -->
  <line x1="450" y1="105" x2="450" y2="130" stroke="#333" stroke-width="2"/>
  <rect x="150" y="130" width="600" height="45" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="450" y="158" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    Communicable, maternal, neonatal, and nutritional diseases (c_295)
  </text>

  <!-- CKD Main -->
  <line x1="450" y1="175" x2="450" y2="210" stroke="#333" stroke-width="3"/>
  <rect x="200" y="210" width="500" height="50" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="450" y="242" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    Chronic kidney disease (c_589)
  </text>

  <!-- Note about underlying causes -->
  <rect x="100" y="280" width="700" height="80" rx="5" fill="#fff9c4" stroke="#f57f17" stroke-width="2"/>
  <text x="450" y="305" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
    Note: GBD 2023 includes underlying etiology subcauses
  </text>
  <text x="450" y="325" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    CKD is modeled by underlying cause (diabetes mellitus type 1 [c_997], diabetes mellitus type 2 [c_998],
  </text>
  <text x="450" y="340" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    hypertension [c_999], glomerulonephritis [c_1000], other/unspecified [c_1001], and end-stage renal
  </text>
  <text x="450" y="355" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    disease [c_1002]). These may be used in future models if etiology-specific modeling is required.
  </text>

  <!-- CKD Stages -->
  <text x="450" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    CKD Categories (6 modeled states)
  </text>

  <!-- Stage definitions in a grid -->
  <g id="stage_boxes">
    <!-- Stage 1-2 -->
    <rect x="80" y="420" width="230" height="100" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="195" y="442" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Stages 1-2 (Albuminuria)
    </text>
    <text x="95" y="462" font-family="Arial, sans-serif" font-size="9" font-weight="bold">
      Definition:
    </text>
    <text x="105" y="478" font-family="Arial, sans-serif" font-size="9">
      eGFR ≥ 60 ml/min/1.73m²
    </text>
    <text x="105" y="493" font-family="Arial, sans-serif" font-size="9">
      AND ACR &gt; 30 mg/g
    </text>
    <text x="95" y="512" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#555">
      Normal/elevated kidney function
    </text>

    <!-- Stage 3 -->
    <rect x="335" y="420" width="230" height="100" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="450" y="442" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Stage 3
    </text>
    <text x="350" y="462" font-family="Arial, sans-serif" font-size="9" font-weight="bold">
      Definition:
    </text>
    <text x="360" y="478" font-family="Arial, sans-serif" font-size="9">
      eGFR 30-60 ml/min/1.73m²
    </text>
    <text x="350" y="502" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#555">
      Moderate decrease in kidney
    </text>
    <text x="360" y="514" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#555">
      function
    </text>

    <!-- Stage 4 -->
    <rect x="590" y="420" width="230" height="100" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="705" y="442" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Stage 4
    </text>
    <text x="605" y="462" font-family="Arial, sans-serif" font-size="9" font-weight="bold">
      Definition:
    </text>
    <text x="615" y="478" font-family="Arial, sans-serif" font-size="9">
      eGFR 15-30 ml/min/1.73m²
    </text>
    <text x="605" y="502" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#555">
      Severe decrease in kidney
    </text>
    <text x="615" y="514" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#555">
      function
    </text>

    <!-- Stage 5 -->
    <rect x="80" y="540" width="230" height="100" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="195" y="562" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Stage 5
    </text>
    <text x="95" y="582" font-family="Arial, sans-serif" font-size="9" font-weight="bold">
      Definition:
    </text>
    <text x="105" y="598" font-family="Arial, sans-serif" font-size="9">
      eGFR &lt; 15 ml/min/1.73m²
    </text>
    <text x="105" y="613" font-family="Arial, sans-serif" font-size="9">
      NOT on RRT
    </text>
    <text x="95" y="632" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#555">
      Kidney failure (pre-RRT)
    </text>

    <!-- ESKD on Dialysis -->
    <rect x="335" y="540" width="230" height="100" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="450" y="562" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      ESKD on Dialysis
    </text>
    <text x="350" y="582" font-family="Arial, sans-serif" font-size="9" font-weight="bold">
      Definition:
    </text>
    <text x="360" y="598" font-family="Arial, sans-serif" font-size="9">
      Maintenance dialysis required
    </text>
    <text x="350" y="620" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#555">
      • Hemodialysis
    </text>
    <text x="350" y="632" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#555">
      • Peritoneal dialysis
    </text>

    <!-- Kidney Transplant -->
    <rect x="590" y="540" width="230" height="100" rx="4" fill="#f3e5f5" stroke="#4a148c" stroke-width="2"/>
    <text x="705" y="562" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Kidney Transplantation
    </text>
    <text x="605" y="582" font-family="Arial, sans-serif" font-size="9" font-weight="bold">
      Definition:
    </text>
    <text x="615" y="598" font-family="Arial, sans-serif" font-size="9">
      Functioning kidney transplant
    </text>
    <text x="605" y="620" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#555">
      Transplanted kidney providing
    </text>
    <text x="615" y="632" font-family="Arial, sans-serif" font-size="8" font-style="italic" fill="#555">
      kidney function
    </text>
  </g>

  <!-- Legend -->
  <rect x="80" y="670" width="740" height="100" rx="5" fill="#f9f9f9" stroke="#999" stroke-width="1"/>
  <text x="450" y="695" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    Legend and Abbreviations
  </text>
  <text x="100" y="720" font-family="Arial, sans-serif" font-size="10">
    <tspan font-weight="bold">c_589:</tspan> GBD cause ID for chronic kidney disease
  </text>
  <text x="100" y="740" font-family="Arial, sans-serif" font-size="10">
    <tspan font-weight="bold">eGFR:</tspan> Estimated glomerular filtration rate (ml/min/1.73m²)
  </text>
  <text x="100" y="760" font-family="Arial, sans-serif" font-size="10">
    <tspan font-weight="bold">ACR:</tspan> Albumin to creatinine ratio (mg/g)
  </text>
  <text x="500" y="720" font-family="Arial, sans-serif" font-size="10">
    <tspan font-weight="bold">RRT:</tspan> Renal replacement therapy
  </text>
  <text x="500" y="740" font-family="Arial, sans-serif" font-size="10">
    <tspan font-weight="bold">ESKD:</tspan> End-stage kidney disease
  </text>
</svg>
