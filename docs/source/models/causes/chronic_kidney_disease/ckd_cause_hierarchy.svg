<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900">
  <!-- Title -->
  <text x="400" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    Chronic Kidney Disease Cause Hierarchy (GBD 2023)
  </text>

  <!-- All Causes -->
  <rect x="250" y="50" width="300" height="40" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="400" y="75" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    All causes (c_294)
  </text>

  <!-- CMNN -->
  <line x1="400" y1="90" x2="400" y2="110" stroke="#333" stroke-width="1"/>
  <rect x="200" y="110" width="400" height="40" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="400" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    Communicable, maternal, neonatal, and nutritional diseases (c_295)
  </text>

  <!-- CKD Main -->
  <line x1="400" y1="150" x2="400" y2="170" stroke="#333" stroke-width="2"/>
  <rect x="225" y="170" width="350" height="40" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="400" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    Chronic kidney disease (c_589)
  </text>

  <!-- Sub-causes -->
  <g id="subcauses">
    <!-- DM Type 1 -->
    <line x1="120" y1="210" x2="120" y2="240" stroke="#666" stroke-width="1"/>
    <rect x="20" y="240" width="200" height="35" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
    <text x="120" y="258" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
      CKD due to diabetes mellitus
    </text>
    <text x="120" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
      type 1 (c_997)
    </text>

    <!-- DM Type 2 -->
    <line x1="240" y1="210" x2="240" y2="240" stroke="#666" stroke-width="1"/>
    <rect x="140" y="240" width="200" height="35" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
    <text x="240" y="258" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
      CKD due to diabetes mellitus
    </text>
    <text x="240" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
      type 2 (c_998)
    </text>

    <!-- Hypertension -->
    <line x1="400" y1="210" x2="400" y2="240" stroke="#666" stroke-width="1"/>
    <rect x="350" y="240" width="100" height="35" rx="3" fill="#e1f5fe" stroke="#01579b" stroke-width="1"/>
    <text x="400" y="254" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
      CKD due to
    </text>
    <text x="400" y="266" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
      hypertension (c_999)
    </text>

    <!-- Glomerulonephritis -->
    <line x1="520" y1="210" x2="520" y2="240" stroke="#666" stroke-width="1"/>
    <rect x="460" y="240" width="120" height="35" rx="3" fill="#f3e5f5" stroke="#4a148c" stroke-width="1"/>
    <text x="520" y="254" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
      CKD due to
    </text>
    <text x="520" y="266" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
      glomerulonephritis (c_1000)
    </text>

    <!-- Other causes -->
    <line x1="660" y1="210" x2="660" y2="240" stroke="#666" stroke-width="1"/>
    <rect x="590" y="240" width="140" height="35" rx="3" fill="#fce4ec" stroke="#880e4f" stroke-width="1"/>
    <text x="660" y="254" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
      CKD due to other and
    </text>
    <text x="660" y="266" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
      unspecified causes (c_1001)
    </text>

    <!-- ESRD -->
    <line x1="400" y1="210" x2="400" y2="310" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="320" y="310" width="160" height="35" rx="3" fill="#e0e0e0" stroke="#424242" stroke-width="1"/>
    <text x="400" y="324" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
      End-stage renal disease
    </text>
    <text x="400" y="336" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
      (c_1002)
    </text>
  </g>

  <!-- Stages for each subcause (example for DM Type 1) -->
  <g id="stages_dm1">
    <text x="120" y="295" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
      Stages (DM Type 1):
    </text>
    <text x="120" y="310" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Albuminuria (s_5540)
    </text>
    <text x="120" y="322" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Stage 3 (s_5225, s_5228, s_5231, s_5234)
    </text>
    <text x="120" y="334" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Stage 4 (s_5249, s_5252, s_5255, s_5258)
    </text>
    <text x="120" y="346" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Stage 5 (s_5273, s_5276, s_5279, s_5282)
    </text>
  </g>

  <!-- Stages for DM Type 2 -->
  <g id="stages_dm2">
    <text x="240" y="295" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
      Stages (DM Type 2):
    </text>
    <text x="240" y="310" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Albuminuria (s_5543)
    </text>
    <text x="240" y="322" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Stage 3 (s_5219, s_5222)
    </text>
    <text x="240" y="334" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Stage 4 (s_5243, s_5246)
    </text>
    <text x="240" y="346" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Stage 5 (s_5267, s_5270)
    </text>
  </g>

  <!-- Stages for Hypertension -->
  <g id="stages_htn">
    <text x="400" y="295" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
      Stages (HTN):
    </text>
    <text x="400" y="310" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Albuminuria (s_5546)
    </text>
    <text x="400" y="322" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Stage 3 (s_5213, s_5216)
    </text>
    <text x="400" y="334" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Stage 4 (s_5237, s_5240)
    </text>
    <text x="400" y="346" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Stage 5 (s_5261, s_5264)
    </text>
  </g>

  <!-- Stages for Glomerulonephritis -->
  <g id="stages_gn">
    <text x="520" y="295" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
      Stages (GN):
    </text>
    <text x="520" y="310" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Albuminuria (s_5549)
    </text>
    <text x="520" y="322" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Stage 3 (s_1024-1027)
    </text>
    <text x="520" y="334" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Stage 4 (s_1433-1430)
    </text>
    <text x="520" y="346" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Stage 5 (s_1385-1382)
    </text>
  </g>

  <!-- Stages for Other -->
  <g id="stages_other">
    <text x="660" y="295" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
      Stages (Other):
    </text>
    <text x="660" y="310" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Albuminuria (s_5552)
    </text>
    <text x="660" y="322" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Stage 3 (s_1016-1019)
    </text>
    <text x="660" y="334" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Stage 4 (s_1421-1418)
    </text>
    <text x="660" y="346" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Stage 5 (s_1373-1370)
    </text>
  </g>

  <!-- ESRD stages -->
  <g id="stages_esrd">
    <text x="400" y="365" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
      ESRD States:
    </text>
    <text x="400" y="380" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Maintenance dialysis (s_5201, s_5204)
    </text>
    <text x="400" y="392" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      Kidney transplant (s_5207, s_5210)
    </text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <rect x="50" y="820" width="700" height="70" rx="5" fill="#f9f9f9" stroke="#999" stroke-width="1"/>
    <text x="400" y="840" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      Legend
    </text>
    <text x="60" y="860" font-family="Arial, sans-serif" font-size="9">
      • c_XXX: Cause IDs in GBD
    </text>
    <text x="60" y="875" font-family="Arial, sans-serif" font-size="9">
      • s_XXX: Sequela IDs in GBD (representing different stages and severities)
    </text>
    <text x="400" y="860" font-family="Arial, sans-serif" font-size="9">
      • CKD stages: 1-2 (Albuminuria), 3, 4, 5
    </text>
    <text x="400" y="875" font-family="Arial, sans-serif" font-size="9">
      • Each subcause has multiple sequelae for different stages
    </text>
  </g>

  <!-- Key definitions -->
  <g id="definitions">
    <rect x="50" y="430" width="700" height="370" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="400" y="455" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      CKD Stage Definitions (GBD 2023)
    </text>

    <!-- Stage definitions table -->
    <text x="70" y="485" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      Stage 1-2 (Albuminuria):
    </text>
    <text x="90" y="500" font-family="Arial, sans-serif" font-size="9">
      eGFR ≥ 60 ml/min/1.73m² and ACR &gt; 30 mg/g
    </text>
    <text x="90" y="515" font-family="Arial, sans-serif" font-size="9">
      Kidney damage with normal or elevated kidney function
    </text>

    <text x="70" y="545" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      Stage 3:
    </text>
    <text x="90" y="560" font-family="Arial, sans-serif" font-size="9">
      eGFR 30-60 ml/min/1.73m²
    </text>
    <text x="90" y="575" font-family="Arial, sans-serif" font-size="9">
      Moderate decrease in kidney function
    </text>

    <text x="70" y="605" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      Stage 4:
    </text>
    <text x="90" y="620" font-family="Arial, sans-serif" font-size="9">
      eGFR 15-30 ml/min/1.73m²
    </text>
    <text x="90" y="635" font-family="Arial, sans-serif" font-size="9">
      Severe decrease in kidney function
    </text>

    <text x="70" y="665" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      Stage 5:
    </text>
    <text x="90" y="680" font-family="Arial, sans-serif" font-size="9">
      eGFR &lt; 15 ml/min/1.73m², not on renal replacement therapy
    </text>
    <text x="90" y="695" font-family="Arial, sans-serif" font-size="9">
      Kidney failure (not yet on dialysis or transplant)
    </text>

    <text x="70" y="725" font-family="Arial, sans-serif" font-size="10" font-weight="bold">
      End-Stage Kidney Disease (ESKD):
    </text>
    <text x="90" y="740" font-family="Arial, sans-serif" font-size="9">
      • On maintenance dialysis (hemodialysis or peritoneal dialysis)
    </text>
    <text x="90" y="755" font-family="Arial, sans-serif" font-size="9">
      • Kidney transplantation (functioning transplant)
    </text>

    <text x="70" y="785" font-family="Arial, sans-serif" font-size="9" font-style="italic">
      Note: eGFR = estimated glomerular filtration rate; ACR = albumin to creatinine ratio
    </text>
  </g>
</svg>
