<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <!-- Title -->
  <text x="300" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    Chronic Kidney Disease Cause Model
  </text>

  <!-- Susceptible State -->
  <rect x="50" y="100" width="150" height="80" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="125" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    Susceptible
  </text>
  <text x="125" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    (No CKD)
  </text>
  <text x="125" y="172" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">
    S
  </text>

  <!-- CKD State -->
  <rect x="400" y="100" width="150" height="80" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="475" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    Chronic Kidney
  </text>
  <text x="475" y="148" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    Disease
  </text>
  <text x="475" y="172" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">
    CKD
  </text>

  <!-- Transition arrow: S -> CKD -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <line x1="200" y1="140" x2="400" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="300" y="130" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    Incidence (i)
  </text>

  <!-- Death transitions -->
  <line x1="125" y1="180" x2="125" y2="240" stroke="#666" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="140" y="215" font-family="Arial, sans-serif" font-size="11" fill="#666">
    Background mortality
  </text>

  <line x1="475" y1="180" x2="475" y2="240" stroke="#666" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="500" y="205" font-family="Arial, sans-serif" font-size="11" fill="#666">
    Background +
  </text>
  <text x="500" y="220" font-family="Arial, sans-serif" font-size="11" fill="#666">
    excess mortality
  </text>

  <!-- Death state -->
  <rect x="250" y="250" width="100" height="30" rx="5" fill="#bdbdbd" stroke="#616161" stroke-width="1"/>
  <text x="300" y="270" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    Death
  </text>

  <!-- Notes -->
  <text x="10" y="290" font-family="Arial, sans-serif" font-size="10" fill="#666">
    Note: CKD state represents all stages (1-5, dialysis, transplant)
  </text>
</svg>
